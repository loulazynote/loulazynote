headline: >-
  DevOps Engineer | Cloud Delivery, CI/CD, Application Depth
summary: >-
  DevOps engineer with backend depth across cloud infrastructure, deployment safety, CI/CD, and
  live-system operations. Built a company's first AWS development and test environment for a restricted
  financial platform, maintained a GitLab CI/CD platform serving about 100-150 engineers, and rebuilt a
  contract deployment path around GCP Cloud Run.
experience:
  - title: "Independent Software Engineer (Contract)"
    company: "Self-employed"
    date: "Sep. 2024 - Present"
    location: "Toronto, ON"
    bullets:
      - >-
        Built a Terraform-based AWS infrastructure foundation with IAM and GitHub Actions OIDC, S3
        remote state, EC2 runtime, Docker Compose deployment, GHCR image flow, nginx, and CloudWatch
        health and log checks.
      - >-
        Migrated an EC2-style deployment to a GCP Cloud Run path, rebuilding Terraform around Cloud SQL,
        Secret Manager, Artifact Registry, Workload Identity Federation, managed SSL, Cloud Monitoring,
        and development/production separation.
      - >-
        Added branch and workflow gates, ref-scoped concurrency, environment-specific runtime
        configuration, and narrowed deployment identity so releases had clearer safety boundaries.
  - title: "Web Development Engineer"
    company: "Duotify Inc."
    date: "Jun. 2020 - Jan. 2024"
    location: "Taipei, Taiwan"
    bullets:
      - >-
        Maintained an internal GitLab CE and CI/CD platform serving about 100-150 engineers across
        Linux, Windows, macOS, and mobile runners; built a production-like test environment to validate
        upgrades and automated recurring maintenance with Bash and Cron.
      - >-
        Took over a 40-50 API financial knowledge platform and built the company's first AWS development
        and test environment with IAM, EC2, S3, RDS, Lambda, SAM CLI, Docker, and PostgreSQL, enabling
        local verification outside the client's restricted environment.
      - >-
        During a week-long traffic and scraper incident on a top-3 Taiwan used-car marketplace with
        50-70k monthly visits, used Azure Monitor to assess CPU, memory, and request patterns and
        supported Auto Scaling, production-to-staging failover, and WAF stabilization.
  - title: "ERP Applications Engineer"
    company: "Unitech Computer Co., Ltd."
    date: "Mar. 2019 - May 2020"
    location: "Taipei, Taiwan"
    bullets:
      - >-
        Supported a nationwide B2B ordering platform whose daily product search, inventory, quotation,
        and order workflows depended on stable legacy web and database systems.
projects: []
skills:
  - category: "Infrastructure"
    items: >-
      Terraform, AWS, GCP, Azure, Cloud Run, Cloud SQL, Workload Identity Federation, Docker
  - category: "CI/CD & Operations"
    items: >-
      GitHub Actions, GitLab CE, GitLab Runner, Azure DevOps, Bash, Cron, Linux, Cloud Monitoring
  - category: "Application Depth"
